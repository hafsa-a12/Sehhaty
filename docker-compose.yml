# Lance l'API Spring Boot + PostgreSQL :
#   JWT_SECRET=$(openssl rand -base64 48) docker compose up --build
# Depuis l'émulateur Android : http://10.0.2.2:3000/api/
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sehhaty
      POSTGRES_USER: sehhaty
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sehhaty-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sehhaty -d sehhaty"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/sehhaty
      DB_USER: sehhaty
      DB_PASSWORD: ${DB_PASSWORD:-sehhaty-dev}
      JWT_SECRET: ${JWT_SECRET:?définis JWT_SECRET (au moins 32 caractères)}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
