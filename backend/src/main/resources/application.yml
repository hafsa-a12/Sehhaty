server:
  port: ${PORT:3000}

spring:
  application:
    name: sehhaty-api
  # Dev : H2 fichier (aucune installation). Prod : profil "prod" -> PostgreSQL.
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/sehhaty;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # DEV UNIQUEMENT : en production, fournir JWT_SECRET (>= 32 caractères aléatoires).
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
